<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Preserve input, not a fixed arrangement.</title><desc>A conceptual transition preserves draft, selection and IME composition while keeping active input above an example keyboard.</desc><rect width="1200" height="560" fill="#edf2f6"/><text x="48" y="38" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#173247">Preserve input, not a fixed arrangement.</text><text x="48" y="94" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#526a7c">Make the insertion point visible through a real resize, fold or keyboard transition.</text><rect x="60" y="158" width="284" height="276" rx="18" fill="#ffffff" stroke="#9dafbc" stroke-width="2"/><rect x="80" y="179" width="244" height="96" rx="10" fill="#dbe5ec"/><text x="99" y="198" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#294a60">Active editor</text><rect x="97" y="235" width="208" height="23" rx="5" fill="#a7dcca"/><path d="M111 239 L111 252" fill="none" stroke="#236955" stroke-width="2"/><rect x="80" y="291" width="244" height="123" rx="10" fill="#e7edf2"/><text x="98" y="321" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#526a7c">Draft</text><text x="98" y="353" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#526a7c">Selection + marked text</text><text x="393" y="244" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#526a7c">SAME STATE</text><path d="M392 292 L555 292" fill="none" stroke="#438d77" stroke-width="4"/><path d="M555 292 L539 281" fill="none" stroke="#438d77" stroke-width="4"/><path d="M555 292 L539 303