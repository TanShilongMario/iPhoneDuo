<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>One app. Every usable shape.</title><desc>Conceptual adaptive layout regions. These are not hardware specifications or app screenshots.</desc><rect width="1200" height="680" fill="#111c28"/><rect x="56" y="42" width="230" height="30" rx="15" fill="#21463f"/><text x="73" y="50" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#aff0d8">SKILL / SWIFTUI + UIKIT</text><text x="56" y="104" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#f5f7fa">One app. Every usable shape.</text><text x="56" y="168" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#b6c5d4">Adapt to available space. Keep context, actions and input continuous.</text><rect x="56" y="232" width="260" height="354" rx="22" fill="#1b2b3d"/><rect x="344" y="232" width="460" height="354" rx="22" fill="#1b2b3d"/><rect x="832" y="232" width="312" height="354" rx="22" fill="#1b2b3d"/><text x="78" y="252" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#a9e4ce">COMPACT</text><rect x="116" y="292" width="140" height="218" rx="20" fill="#e8eef3" stroke="#7f95a8" stroke-width="2"/><rect x="132" y="318" width="84" height="42" rx="9" fill="#a7dcca"/><rect x="132" y="373" width="84" height="115" rx="9" fill="#c7d3dd"/><rect x="226" y="342" width="16" height="125" rx="8" fill="#94cfbd"/><rect x="226" y="310" width="16" height="16" rx="8" fill="#e6a6a0"/><text x="80" y="536" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#f5f7fa">Clear controls.</text><text x="80" y="561" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#b6c5d4">Familiar navigation.</text><text x="366" y="252" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#a9e4ce">EXPANDED</text><rect x="365" y="321" width="418" height="186" rx="16" fill="#e8eef3" stroke="#7f95a8" stroke-width="2"/><rect x="383" y="339" width="215" height="150" rx="10" fill="#c7d3dd"/><rect x="610" y="339" width="129" height="150" rx="10" fill="#a7dcca"/><rect x="751" y="354" width="16" height="118" rx="8" fill="#94cfbd"/><text x="404" y="392" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#334c60">Content</text><text x="630" y="395" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#334c60">Context</text><text x="367" y="536" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#f5f7fa">Reveal useful context.</text><text x="367" y="561" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#b6c5d4">Follow the actual window and system edge.</text><text x="854" y="252" dominant-baseline="text-before-edge" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#a9e4ce">KEYBOARD</text><rect x="894" y="292" width="188" height="218" rx="20" fill="#e8eef3" stroke="#7f95a8" stroke-width="2"/><rect x="910" y="314" width="156" height="94" rx="9" fill="#c7d3dd"/><rect x="922" y="337" width="132" height="35" rx="6" fill="#a7dcca"/><path d="M934 348 L934 362" fill="none" stroke="#236955" stroke-width="2"/><rect x="910" y="422" width="156" height="70" rx="8" fill="#a9bac8"/><rect x="920" y="433" width="13" height="12" rx="2" fill="#edf2f6"/><rect x="939" y="433" width="13" height="12" rx="2" fill="#edf2f6"/><rect x="958" y="433" width="13" height="12" rx="2" fill="#edf2f6"/><rect x="977" y="433" width="